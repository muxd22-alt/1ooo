name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          get_bt() { curl -s "${hdr[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" | jq -r '.build_type // empty'; }
          current=$(get_bt)
          echo "current build_type: ${current:-<unreadable>}"
          if [ "$current" = "workflow" ]; then echo "already workflow mode"; exit 0; fi
          code=$(curl -s -o pages-patch.json -w '%{http_code}' -X PATCH "${hdr[@]}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"build_type":"workflow"}')
          echo "PATCH pages build_type=workflow -> HTTP $code"
          cat pages-patch.json; echo
          if [ "$code" = "200" ]; then echo "switched to workflow mode"; exit 0; fi
          if [ "$(get_bt)" = "workflow" ]; then echo "already workflow mode"; exit 0; fi
          echo "::error title=GitHub Pages source is wrong::Pages is set to serve raw repo files (build_type=${current:-unknown}) and the API cannot switch it (HTTP $code, needs repo admin). Fix: github.com/$GITHUB_REPOSITORY/settings/pages -> Build and deployment -> Source -> GitHub Actions, then re-run this workflow. Until then the site serves unbundled source and will not boot."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
