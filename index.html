  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1ooo — Voxel Engine (Phase 1)</title>

  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <pre id="hud-stats">booting…</pre>

        document.getElementById('hud-stats').textContent =

      }
    </script>
